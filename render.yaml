services:
  - type: web
    name: alpha-clipper
    runtime: docker
    plan: free
    dockerCommand: python -m alpha.cloud
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALPHA_STORAGE_PROVIDER
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: ALPHA_RUN_EMBEDDED_WORKER
        value: false
      - key: ALPHA_PROVIDER_MODE
        value: live
      - key: ALPHA_REQUIRE_AUTH
        value: true
      - key: ALPHA_COOKIE_SECURE
        value: true
      - key: ALPHA_EMAIL_PROVIDER
        value: resend
      - key: ALPHA_ADMIN_EMAIL
        sync: false
      - key: ALPHA_ADMIN_PASSWORD
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_OAUTH_CLIENT_ID
        sync: false
      - key: YOUTUBE_OAUTH_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_OAUTH_REFRESH_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_USER_ID
        sync: false
